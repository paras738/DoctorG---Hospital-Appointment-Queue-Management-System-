name: doctor_g
description: "DoctorG — City Doctor Discovery, Booking & Live Queue App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Supabase (PostgreSQL, PostGIS, Auth, Realtime, Storage)
  supabase_flutter: ^2.8.0

  # Push Notifications (FCM v1 ONLY - Zero Firestore/Firebase Auth)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Payments (TEST Mode Only)
  razorpay_flutter: ^1.3.7

  # Maps & Navigation
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1

  # Local Offline Cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2

  # Routing & Config
  go_router: ^14.2.7
  flutter_dotenv: ^5.1.0
  http: ^1.2.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
